<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medica - Medicine Finder</title>
    <style>
        body { font-family: sans-serif; background-color: #0a0f1d; color: #fff; text-align: center; padding: 50px; }
        .box { background: #161b30; padding: 40px; border-radius: 12px; max-width: 500px; margin: 0 auto; border: 1px solid #0070f3; }
        input { width: 80%; padding: 12px; margin: 20px 0; border-radius: 4px; border: none; }
        button { background: #0070f3; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Medica Medicine Finder</h1>
        <p>Your custom design website is now active.</p>
        <input type="text" placeholder="Enter medicine name...">
        <br>
        <button type="button">Search System</button>
    </div>
</body>
</html>
